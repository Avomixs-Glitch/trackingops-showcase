<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="560" viewBox="0 0 1680 560" role="img" aria-labelledby="title desc"><title id="title">TrackingOps AI investigation flow</title><desc id="desc">A signal becomes observation, correlation, grounded AI assistance, an operator decision and a controlled response.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111323"/><stop offset="1" stop-color="#080a10"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64687b"/></marker><filter id="glow"><feGaussianBlur stdDeviation="18"/></filter></defs><style>.title{font:700 31px Inter,Segoe UI,sans-serif;fill:#f7f7fb}.subtitle{font:400 15px Inter,Segoe UI,sans-serif;fill:#8e93a7}.card-title{font:700 16px Inter,Segoe UI,sans-serif;fill:#f7f7fb}.card-sub{font:400 12px Inter,Segoe UI,sans-serif;fill:#9ca0b3}.edge-label{font:600 11px Inter,Segoe UI,sans-serif;fill:#777c90}.kicker{font:700 11px Inter,Segoe UI,sans-serif;fill:#a99fff;letter-spacing:2px}</style><rect width="1680" height="560" rx="28" fill="url(#bg)"/><circle cx="920" cy="260" r="210" fill="#b56cff" opacity=".07" filter="url(#glow)"/><text x="60" y="62" class="kicker">INVESTIGATION FLOW</text><text x="60" y="108" class="title">From signal to controlled response.</text><text x="60" y="140" class="subtitle">AI accelerates the investigation. Evidence stays visible. The operator keeps the final decision.</text><line x1="230" y1="290" x2="300" y2="290" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/><line x1="490" y1="290" x2="560" y2="290" stroke="#8b7cff" stroke-width="2" marker-end="url(#arrow)"/><line x1="750" y1="290" x2="820" y2="290" stroke="#e879f9" stroke-width="2" marker-end="url(#arrow)"/><line x1="1030" y1="290" x2="1100" y2="290" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/><line x1="1300" y1="290" x2="1370" y2="290" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow)"/><ellipse cx="145" cy="290" rx="85" ry="45" fill="#10232a" stroke="#22d3ee" stroke-width="2"/>
<text x="145" y="282" text-anchor="middle" class="card-title">Signal</text>
<text x="145" y="310" text-anchor="middle" class="card-sub">Something changed</text><rect x="300" y="230" width="190" height="120" rx="18" fill="#10232a" stroke="#22d3ee" stroke-width="2"/>
<text x="395" y="282" text-anchor="middle" class="card-title">Observe</text>
<text x="395" y="310" text-anchor="middle" class="card-sub">Live telemetry + context</text><rect x="560" y="230" width="190" height="120" rx="18" fill="#17152c" stroke="#8b7cff" stroke-width="2"/>
<text x="655" y="282" text-anchor="middle" class="card-title">Correlate</text>
<text x="655" y="310" text-anchor="middle" class="card-sub">History, alerts, posture</text><rect x="820" y="230" width="210" height="120" rx="18" fill="#25152c" stroke="#e879f9" stroke-width="2"/>
<text x="925" y="282" text-anchor="middle" class="card-title">AI KILLING</text>
<text x="925" y="310" text-anchor="middle" class="card-sub">Context + live tool output</text><rect x="1100" y="230" width="200" height="120" rx="18" fill="#2b2112" stroke="#fbbf24" stroke-width="2"/>
<text x="1200" y="282" text-anchor="middle" class="card-title">Operator Decision</text>
<text x="1200" y="310" text-anchor="middle" class="card-sub">Review evidence</text><rect x="1370" y="230" width="210" height="120" rx="18" fill="#10251b" stroke="#4ade80" stroke-width="2"/>
<text x="1475" y="282" text-anchor="middle" class="card-title">Controlled Response</text>
<text x="1475" y="310" text-anchor="middle" class="card-sub">Runbook or handoff</text><text x="60" y="505" class="subtitle">Observe → understand → decide → act · No invisible autonomous control</text></svg>