<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">The TrackingOps operating loop</title>
  <desc id="desc">Signals are observed, understood with context, and transformed into deliberate operator action.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0a0b0f"/>
      <stop offset="1" stop-color="#11131a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7c68ff"/>
      <stop offset=".5" stop-color="#38d4ff"/>
      <stop offset="1" stop-color="#60e9ab"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(800 260) rotate(90) scale(350 720)">
      <stop stop-color="#7764ff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#7764ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="560" rx="34" fill="url(#background)"/>
  <rect width="1600" height="560" rx="34" fill="url(#aura)"/>
  <rect x="1" y="1" width="1598" height="558" rx="33" fill="none" stroke="#fff" stroke-opacity=".1"/>

  <g font-family="Segoe UI Variable Text, Aptos, system-ui, sans-serif">
    <text x="72" y="69" fill="#7f8799" font-size="12" font-weight="700" letter-spacing="4">THE TRACKINGOPS OPERATING LOOP</text>
    <text x="72" y="116" fill="#f7f8fb" font-size="35" font-weight="700" letter-spacing="-.7">From raw machine state to deliberate action.</text>
  </g>

  <path d="M297 308H585M806 308h288" stroke="#fff" stroke-opacity=".12" stroke-width="2" stroke-dasharray="5 10"/>
  <path d="m566 299 19 9-19 9M1075 299l19 9-19 9" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(72 176)" font-family="Segoe UI Variable Text, Aptos, system-ui, sans-serif">
    <rect width="392" height="300" rx="28" fill="#fff" fill-opacity=".045" stroke="#fff" stroke-opacity=".1"/>
    <rect x="9" y="9" width="374" height="282" rx="21" fill="#07090d" fill-opacity=".68" stroke="#fff" stroke-opacity=".055"/>
    <text x="32" y="48" fill="#8f7cff" font-size="11" font-weight="800" letter-spacing="3">01 / OBSERVE</text>
    <text x="32" y="84" fill="#fff" font-size="24" font-weight="700">Know what is happening.</text>
    <text x="32" y="115" fill="#8e96a8" font-size="13">Live context from the host and its workloads.</text>
    <g fill="#c6cbd6" font-size="13">
      <circle cx="36" cy="158" r="4" fill="#7c68ff" filter="url(#softGlow)"/><text x="53" y="163">CPU · GPU · memory · storage</text>
      <circle cx="36" cy="198" r="4" fill="#38d4ff"/><text x="53" y="203">Processes · ports · connections</text>
      <circle cx="36" cy="238" r="4" fill="#60e9ab"/><text x="53" y="243">Docker · services · local history</text>
    </g>
  </g>

  <g transform="translate(604 150)" font-family="Segoe UI Variable Text, Aptos, system-ui, sans-serif">
    <rect width="392" height="352" rx="28" fill="#fff" fill-opacity=".055" stroke="#8c78ff" stroke-opacity=".3"/>
    <rect x="9" y="9" width="374" height="334" rx="21" fill="#0a0c12" stroke="#fff" stroke-opacity=".07"/>
    <rect x="31" y="30" width="130" height="28" rx="14" fill="#7764ff" fill-opacity=".15"/>
    <circle cx="48" cy="44" r="4" fill="#8f7cff"/>
    <text x="61" y="48" fill="#b6aaff" font-size="10" font-weight="800" letter-spacing="2">AI + CONTEXT</text>
    <text x="31" y="99" fill="#fff" font-size="24" font-weight="700">Understand what matters.</text>
    <text x="31" y="130" fill="#8e96a8" font-size="13">Connect signals to operating context.</text>
    <g transform="translate(31 160)">
      <rect width="330" height="52" rx="14" fill="#fff" fill-opacity=".045"/>
      <text x="17" y="23" fill="#f0f2f7" font-size="12" font-weight="700">Correlate</text>
      <text x="17" y="40" fill="#828a9b" font-size="10">health · alerts · security · history</text>
    </g>
    <g transform="translate(31 224)">
      <rect width="330" height="52" rx="14" fill="#fff" fill-opacity=".045"/>
      <text x="17" y="23" fill="#f0f2f7" font-size="12" font-weight="700">Investigate</text>
      <text x="17" y="40" fill="#828a9b" font-size="10">AI KILLING · scans · diagnostics</text>
    </g>
    <text x="31" y="317" fill="#7063db" font-size="10" font-weight="800" letter-spacing="2">GROUND EVERY ANSWER</text>
  </g>

  <g transform="translate(1136 176)" font-family="Segoe UI Variable Text, Aptos, system-ui, sans-serif">
    <rect width="392" height="300" rx="28" fill="#fff" fill-opacity=".045" stroke="#fff" stroke-opacity=".1"/>
    <rect x="9" y="9" width="374" height="282" rx="21" fill="#07090d" fill-opacity=".68" stroke="#fff" stroke-opacity=".055"/>
    <text x="32" y="48" fill="#60e9ab" font-size="11" font-weight="800" letter-spacing="3">03 / RESPOND</text>
    <text x="32" y="84" fill="#fff" font-size="24" font-weight="700">Choose the next action.</text>
    <text x="32" y="115" fill="#8e96a8" font-size="13">Keep control visible and intentional.</text>
    <g fill="#c6cbd6" font-size="13">
      <circle cx="36" cy="158" r="4" fill="#60e9ab" filter="url(#softGlow)"/><text x="53" y="163">Validate with live tools</text>
      <circle cx="36" cy="198" r="4" fill="#38d4ff"/><text x="53" y="203">Run constrained workflows</text>
      <circle cx="36" cy="238" r="4" fill="#7c68ff"/><text x="53" y="243">Preserve history and accountability</text>
    </g>
  </g>
</svg>
